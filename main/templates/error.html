{% load static %}

{%block content %}
    <title>404 - Page Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-template {
            text-align: center;
        }
        .error-template h1 {
            font-size: 120px;
            font-weight: bold;
            color: #dc3545;
        }
        .btn-home {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container error-template">
        <h1>404</h1>
        <h3 class="text-danger">Oops! Page Not Found</h3>
        <p class="text-muted">Sorry, the page you were looking for does not exist.</p>
        <a href="{% url 'home' %}" class="btn btn-primary btn-home">Return to Home</a>
    </div>
{% endblock %}
