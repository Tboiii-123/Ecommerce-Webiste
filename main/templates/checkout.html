{% block content%}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - Electro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://js.stripe.com/v3/"></script>

  <style>
    #payment-card {
      max-width: 400px;
      margin: 30px auto;
      padding: 20px 25px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
      border: 1px solid #e0e0e0;
    }
    
    #card-element {
      border: 1px solid #ced4da;
      padding: 12px 14px;
      border-radius: 4px;
      margin-bottom: 20px;
      background-color: #fff;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }
    
    /* On focus highlight */
    #card-element:focus {
      border-color: #007bff;
      outline: none;
      box-shadow: 0 0 5px rgba(0,123,255,0.5);
    }
    
    #submit {
      width: 100%;
      font-weight: 600;
      padding: 12px;
      border-radius: 5px;
      font-size: 1.1rem;
    }
    
    #error-message {
      color: #d9534f;
      margin-top: 12px;
      font-weight: 500;
      min-height: 1.4em;
      text-align: center;
    }
    
    h2.checkout-title {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 700;
      font-size: 1.75rem;
      color: #343a40;
    }
    
  </style>
</head>
<body class="container py-5">

  <div id="payment-card" class="bg-white">
    <h2 class="checkout-title">Checkout — ${{ amount }}</h2>
    <form id="payment-form" novalidate>
      <div id="card-element"><!-- Stripe injects card input --></div>
      <button id="submit" class="btn btn-primary mt-3">Pay</button>
      <div id="error-message" role="alert"></div>
    </form>
  </div>
  
  <script>
    
    const stripe = Stripe("{{ stripe_publishable_key }}");
    const elements = stripe.elements();
    const card = elements.create('card');
    card.mount('#card-element');

    const form = document.getElementById('payment-form');
    const errorMessage = document.getElementById('error-message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorMessage.textContent = ''; // clear previous errors

      const {error, paymentIntent} = await stripe.confirmCardPayment(
        "{{ client_secret }}",
        {
          payment_method: {
            card: card,
          }
        }
      );

      if (error) {
        errorMessage.textContent = error.message;
      } else if (paymentIntent && paymentIntent.status === 'succeeded') {
        alert('Payment succeeded!');
        window.location.href = '/cart/';  // Change this URL to your success page
        
      }
    });
  </script>

</body>
</html>
{% endblock %}
